# HTTP to HTTPS redirect
server {
    listen 80;
    server_name congonews.news www.congonews.news;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name congonews.news www.congonews.news;

    ssl_certificate /etc/letsencrypt/live/congonews.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/congonews.news/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/congonews.news;
    index index.html;

    # Detect social media crawlers and bots
    set $prerender 0;
    # Match WhatsApp, Facebook, Telegram, etc. so they get OG HTML (large image card like Okapi-style shares)
    if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Discordbot|Googlebot|bingbot|yandex|baiduspider|rogerbot|embedly|quora|showyoubot|outbrain|pinterest|vkShare|W3C_Validator|developers\.google\.com/\+/web/snippet|Applebot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|ia_archiver") {
        set $prerender 1;
    }
    if ($args ~ "_escaped_fragment_") {
        set $prerender 1;
    }
    if ($http_user_agent ~ "Prerender") {
        set $prerender 0;
    }

    # Proxy uploads/images to backend (MUST be first)
    location /uploads/ {
        proxy_pass http://127.0.0.1:9988;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Proxy API requests to backend (MUST be second)
    location /api/ {
        proxy_pass http://127.0.0.1:9988;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Prerender for social media crawlers - article pages
    location ~ ^/article/([0-9]+)$ {
        if ($prerender = 1) {
            proxy_pass http://127.0.0.1:9988/prerender/article/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header User-Agent $http_user_agent;
            break;
        }
        try_files $uri /index.html;
    }

    # Handle favicon
    location = /favicon.ico {
        try_files $uri /index.html;
        access_log off;
        log_not_found off;
    }

    # Cache static assets (but NOT /uploads/)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve frontend SPA - MUST be last (catch-all)
    location / {
        try_files $uri /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}



