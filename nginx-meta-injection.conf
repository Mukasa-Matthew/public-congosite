# Nginx configuration with meta tag injection for social media previews
# This requires nginx with http_sub_module enabled
# Check with: nginx -V 2>&1 | grep -o with-http_sub_module

# Add this inside the HTTPS server block, before the location /uploads/ block

# Meta tag injection for article pages
location ~ ^/article/([0-9]+)$ {
    # First, try to serve the file
    try_files $uri /index.html;
    
    # If sub_filter module is available, inject meta tags
    # This requires: apt install nginx-module-http-sub
    # sub_filter '</head>' '<meta property="og:title" content="Article Title" />
    # <meta property="og:image" content="https://congonews.news/image.jpg" />
    # <meta property="og:description" content="Article description" />
    # </head>';
    # sub_filter_once on;
}

